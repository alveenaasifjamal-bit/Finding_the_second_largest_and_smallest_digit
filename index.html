<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let num = +prompt(
        "enter a number and i will tell you the second largest digit in this number",
      );
      num = Math.abs(num);
      let largest = 0;
      let second = -1;
      while (num > 0) {
        let Digit = num % 10;
        if (Digit > largest) {
          second = largest;
          largest = Digit;
        } else if (Digit < largest && Digit > second) {
          second = Digit;
        }
        num = Math.floor(num / 10);
      }
      console.log(largest);
      if (second === -1) {
        console.log("no second largest digit");
      } else {
        console.log(second);
      }

      let newNum = +prompt(
        "enter the number i will tell the second smallest digit in the number",
      );
      newNum = Math.abs(newNum);
      let smallest = newNum % 10;
      newNum = Math.floor(newNum / 10);
      let another = -1;
      while (newNum > 0) {
        let digit = newNum % 10;
        if (digit < smallest) {
          another = smallest;
          smallest = digit;
        } else if (digit > smallest && (digit < another || another === -1)) {
          another = digit;
        }
        newNum = Math.floor(newNum / 10);
      }
      console.log(smallest);
      if (another === -1) {
        console.log("no second smallest number");
      } else {
        console.log(another);
      }
    </script>
  </body>
</html>
